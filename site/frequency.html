<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8203;</title>
<link rel="stylesheet" href="shared/void.css">
</head>
<body>
<canvas class="stage" id="stage" style="cursor: ew-resize"></canvas>
<script src="shared/audio.js"></script>
<script src="shared/gl.js"></script>
<script>
// FREQUENCY: the songs hide inside static. Drag or scroll to tune.
// Between stations there is only hiss; when you land on one, the wire
// pulls tight and turns into the song's waveform.
const P = VOID.player;
const N = VOID.TRACKS.length;
const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = stage.width = Math.floor(innerWidth * dpr);
  H = stage.height = Math.floor(innerHeight * dpr);
}
resize();
addEventListener("resize", resize);

// Stations sit at uneven places on the dial, so nothing feels like a menu.
const STATIONS = VOID.TRACKS.map((_, i) => i * 1.0 + [0, 0.23, -0.17, 0.31, -0.08, 0.12][i % 6]);
const DIAL_MIN = -0.8, DIAL_MAX = N - 0.2;
let pos = DIAL_MIN, vel = 0, dragging = false, entered = false;
let clarity = 0, nearest = -1;

VOID.pointer(stage, {
  drag(dx) { dragging = true; vel = -dx / innerWidth * 2.2; pos += vel; },
  release(vx) { dragging = false; vel = -vx * 0.02; },
});
stage.addEventListener("pointerup", () => (dragging = false));
addEventListener("wheel", (e) => { vel += (e.deltaY + e.deltaX) * 0.00035; }, { passive: true });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") vel += 0.035;
  if (e.key === "ArrowLeft") vel -= 0.035;
});

VOID.gate(() => { entered = true; P.noise(); vel = 0.045; });
VOID.mockNav();

const live = new Set();
function mix() {
  let best = 0; nearest = -1;
  STATIONS.forEach((s, i) => {
    const g = Math.exp(-Math.pow((pos - s) / 0.16, 2));
    if (g > best) { best = g; nearest = i; }
    if (g > 0.002) {
      if (!live.has(i)) { live.add(i); P.ensure(i); }
      P.gain(i, g, 0.05);
    } else if (live.has(i)) {
      live.delete(i);
      P.gain(i, 0, 0.05);
      P.release(i, 0.4);
    }
  });
  const n = P.noise();
  n.out.gain.setTargetAtTime((1 - best) * 0.22, P.ctx.currentTime, 0.05);
  n.bp.frequency.setTargetAtTime(1200 + ((pos * 977) % 1) * 3000, P.ctx.currentTime, 0.1);
  return best;
}

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  if (!dragging) {
    pos += vel;
    vel *= 0.93;
    // Faint magnetism toward a station once you are close.
    const near = STATIONS.reduce((a, s) => (Math.abs(s - pos) < Math.abs(a - pos) ? s : a), STATIONS[0]);
    if (Math.abs(near - pos) < 0.3 && Math.abs(vel) < 0.01) vel += (near - pos) * 0.006;
  }
  pos = Math.max(DIAL_MIN, Math.min(DIAL_MAX, pos));
  if (entered) clarity += (mix() - clarity) * 0.2;

  ctx.fillStyle = "rgba(0,0,0,0.38)";              // motion trails
  ctx.fillRect(0, 0, W, H);

  // static snow, thinning as the signal clears
  const snow = (1 - clarity) * (entered ? 1 : 0.25);
  const flecks = Math.floor(snow * 900 * dpr);
  for (let i = 0; i < flecks; i++) {
    const a = Math.random() * 0.22 * snow;
    ctx.fillStyle = `rgba(220,226,235,${a})`;
    ctx.fillRect(Math.random() * W, Math.random() * H, dpr, dpr);
  }

  // the wire
  const L = P.levels();
  const mid = H / 2;
  const amp = H * 0.28;
  const grad = ctx.createLinearGradient(0, mid - amp, 0, mid + amp);
  grad.addColorStop(0, "#5a5e66");
  grad.addColorStop(0.42, "#ffffff");
  grad.addColorStop(0.5, "#8b9099");
  grad.addColorStop(0.58, "#f2f4f8");
  grad.addColorStop(1, "#3a3d43");
  ctx.strokeStyle = grad;
  ctx.lineWidth = (0.8 + clarity * 1.4) * dpr;
  ctx.shadowColor = "rgba(235,240,255,0.55)";
  ctx.shadowBlur = clarity * 14 * dpr;
  ctx.beginPath();
  const pts = 320;
  for (let k = 0; k <= pts; k++) {
    const x = (k / pts) * W;
    const env = Math.sin((k / pts) * Math.PI);            // pinned at both ends
    let y = 0;
    if (L.wave) y += L.wave[Math.floor((k / pts) * (L.wave.length - 1))] * clarity * 2.2;
    y += (Math.random() - 0.5) * 0.12 * (1 - clarity) * (entered ? 1 : 0.2);
    y += Math.sin(k * 0.05 + t * 1.3) * 0.01;
    ctx.lineTo(x, mid + y * amp * env);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // the dial: hairline ticks along the bottom, sliding as you tune
  const base = H - (36 + 0) * dpr;
  const span = W / 3.2;
  for (let f = Math.floor(pos - 2) * 10; f <= Math.ceil(pos + 2) * 10; f++) {
    const x = W / 2 + (f / 10 - pos) * span;
    const major = f % 10 === 0;
    ctx.fillStyle = `rgba(160,166,176,${major ? 0.35 : 0.14})`;
    ctx.fillRect(x, base - (major ? 10 : 4) * dpr, dpr, (major ? 10 : 4) * dpr);
  }
  ctx.fillStyle = "rgba(240,244,250,0.75)";
  ctx.fillRect(W / 2 - dpr * 0.5, base - 16 * dpr, dpr, 16 * dpr);

  requestAnimationFrame(frame);
}
ctx.fillStyle = "#000";
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(frame);
</script>
</body>
</html>
