<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8203;</title>
<link rel="stylesheet" href="shared/void.css">
</head>
<body>
<canvas class="stage" id="stage"></canvas>
<div class="mark" id="mark" aria-live="polite"></div>
<script src="shared/audio.js"></script>
<script src="shared/gl.js"></script>
<script>
// MERCURY: one liquid-chrome object. Each song is a different form.
// Flick it away and it melts into the next one.
const frag = `
uniform vec2 u_rot;
uniform float u_a, u_b, u_morph, u_bass, u_mid, u_high, u_shock;
uniform vec2 u_dir;

float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0); return mix(b, a, h) - k*h*(1.0-h); }
float box2(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }

float form(vec3 p, float id){
  float t = u_time * 0.4;
  if (id < 0.5) {                       // I: breathing blob
    float d = length(p) - 0.6;
    for (int i = 0; i < 4; i++) {
      float f = float(i);
      vec3 c = 0.55 * vec3(sin(t*1.3 + f*1.7), cos(t*1.1 + f*2.3), sin(t*0.9 + f*3.1));
      d = smin(d, length(p - c) - 0.27, 0.38);
    }
    return d;
  }
  if (id < 1.5) {                       // II: twisted ribbon ring
    float a = atan(p.z, p.x);
    vec2 q = vec2(length(p.xz) - 0.72, p.y);
    q *= rot(a * 1.5 + t);
    return (box2(q, vec2(0.24, 0.06)) - 0.05) * 0.8;
  }
  if (id < 2.5) {                       // III: soft crystal
    vec3 q = p; q.xz *= rot(t * 0.5); q.xy *= rot(0.4);
    q = abs(q);
    return (q.x + q.y + q.z - 0.95) * 0.577 - 0.06;
  }
  if (id < 3.5) {                       // IV: falling drop with ripples
    vec3 q = p * vec3(1.0, 0.62, 1.0);
    return (length(q) - 0.6 + 0.04 * sin(9.0 * p.y - u_time * 3.0)) * 0.7;
  }
  vec3 q = p; q.yz *= rot(t * 0.3);    // V: lattice inside a sphere
  float g = abs(dot(sin(q * 5.5), cos(q.zxy * 5.5))) / 5.5 - 0.035;
  return max(length(p) - 0.9, g * 0.8);
}

float map(vec3 p){
  p.xz *= rot(u_rot.x);
  p.yz *= rot(u_rot.y);
  // stretch along the flick direction
  vec3 dir = vec3(u_dir, 0.0);
  p -= dir * dot(p, dir) * u_shock * 0.45;
  float d = mix(form(p, u_a), form(p, u_b), u_morph);
  float melt = sin(3.14159 * u_morph);
  d -= melt * 0.08 * sin(p.x*5.0 + u_time*2.0) * sin(p.y*4.0 - u_time);
  d += sin(p.x*7.0 + u_time) * sin(p.y*7.0) * sin(p.z*7.0) * 0.045 * u_bass;
  return d;
}

vec3 normal(vec3 p){
  vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy*map(p+e.xyy) + e.yyx*map(p+e.yyx) + e.yxy*map(p+e.yxy) + e.xxx*map(p+e.xxx));
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
  vec3 ro = vec3(0.0, 0.0, 4.6);
  vec3 rd = normalize(vec3(uv, -1.8));
  float t = 0.0, d = 1.0;
  int steps = 0;
  for (int i = 0; i < 96; i++) {
    d = map(ro + rd*t);
    if (d < 0.001 || t > 8.0) break;
    t += d * 0.8;
    steps = i;
  }
  vec3 col = vec3(0.0);
  if (d < 0.002) {
    vec3 p = ro + rd*t;
    vec3 n = normal(p);
    vec3 r = reflect(rd, n);
    float fr = pow(1.0 - max(0.0, dot(-rd, n)), 3.0);
    col = studio(r) * mix(0.55, 1.1, fr);
    col += vec3(0.9, 0.95, 1.0) * fr * 0.15 * (0.4 + u_high * 2.0);
    col *= 1.0 - float(steps) / 160.0;      // cheap cavity darkening
  }
  // a breath of light behind the object on the beat
  col += vec3(0.6, 0.62, 0.68) * exp(-length(uv) * 3.2) * 0.04 * (0.4 + u_bass);
  col = col / (1.0 + col) * 1.35;
  col = pow(col, vec3(0.85));
  col += grain(gl_FragCoord.xy, u_time) * 0.035;
  gl_FragColor = vec4(col, 1.0);
}`;

const P = VOID.player;
const N = VOID.TRACKS.length;
const FORMS = 5;
const NUMERALS = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const stage = document.getElementById("stage");
const markEl = document.getElementById("mark");
const S = VOID.shader(stage, frag);

let rx = 0.4, ry = 0.15, vrx = 0, vry = 0;
let formA = 0, formB = 0, morph = 1, morphStart = 0;
let shock = 0, dir = [1, 0];
let track = -1, markTimer;
let bass = 0, mid = 0, high = 0;

function go(i, dx = 1, dy = 0) {
  i = ((i % N) + N) % N;
  if (i === track) return;
  track = P.play(i);
  formA = formB;
  formB = i % FORMS;
  morph = 0;
  morphStart = performance.now();
  const len = Math.hypot(dx, dy) || 1;
  dir = [dx / len, dy / len];
  shock = 1;
  markEl.textContent = NUMERALS[i] || i + 1;
  markEl.classList.add("on");
  clearTimeout(markTimer);
  markTimer = setTimeout(() => markEl.classList.remove("on"), 2200);
}

VOID.pointer(stage, {
  drag(dx, dy) { rx += dx * 0.007; ry += dy * 0.007; vrx = dx * 0.007; vry = dy * 0.007; },
  release(vx, vy) {
    if (Math.hypot(vx, vy) > 0.9) go(track + (vx >= 0 ? 1 : -1), vx, -vy);
  },
  tap() { shock = Math.max(shock, 0.35); dir = [0, 1]; },
});
window.addEventListener("keydown", (e) => {
  if (track < 0) return;
  if (e.key === "ArrowRight") go(track + 1, 1, 0);
  if (e.key === "ArrowLeft") go(track - 1, -1, 0);
});

VOID.gate(() => go(0, 0, 1));
VOID.mockNav();

const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
function frame(now) {
  const L = P.levels();
  bass += (L.bass - bass) * 0.25; mid += (L.mid - mid) * 0.2; high += (L.high - high) * 0.2;
  vrx *= 0.95; vry *= 0.95;
  rx += vrx + (VOID.reducedMotion ? 0 : 0.0018); ry += vry;
  ry = ry * 0.985 + 0.15 * 0.015;
  morph = Math.min(1, (now - morphStart) / 1700);
  shock *= 0.93;
  S.u("u_rot", rx, ry);
  S.u("u_a", formA); S.u("u_b", formB); S.u("u_morph", ease(morph));
  S.u("u_bass", bass); S.u("u_mid", mid); S.u("u_high", high);
  S.u("u_shock", shock); S.u("u_dir", dir[0], dir[1]);
  S.draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
