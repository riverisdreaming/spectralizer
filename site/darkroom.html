<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8203;</title>
<link rel="stylesheet" href="shared/void.css">
</head>
<body>
<canvas class="stage" id="stage" style="cursor: none"></canvas>
<script src="shared/audio.js"></script>
<script src="shared/gl.js"></script>
<script>
// DARKROOM: the room is pitch black and your cursor is the only light.
// Chrome spheres hang somewhere in it, one per song. Find one, touch it,
// and it drifts toward you and starts to play.
const MAX = 8;
const frag = `
uniform vec4 u_s[${MAX}];
uniform float u_n, u_active, u_bass, u_high;
uniform vec3 u_light;

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
  vec3 ro = vec3(0.0, 0.0, 4.0);
  vec3 rd = normalize(vec3(uv, -1.6));

  float tMin = 1e9; int hit = -1; vec4 S = vec4(0.0);
  for (int i = 0; i < ${MAX}; i++) {
    if (float(i) >= u_n) break;
    vec4 s = u_s[i];
    vec3 oc = ro - s.xyz;
    float b = dot(oc, rd);
    float c = dot(oc, oc) - s.w*s.w;
    float h = b*b - c;
    if (h > 0.0) {
      float t = -b - sqrt(h);
      if (t > 0.0 && t < tMin) { tMin = t; hit = i; S = s; }
    }
  }

  vec2 luv = u_light.xy * 1.6 / (4.0 - u_light.z);
  float halo = exp(-length(uv - luv) * 5.0);
  vec3 col = vec3(0.75, 0.78, 0.85) * halo * 0.035;
  col += vec3(hash(floor(gl_FragCoord.xy / 2.0) + floor(u_time * 8.0)) * halo * 0.04); // dust in the beam

  if (hit >= 0) {
    vec3 p = ro + rd * tMin;
    vec3 n = normalize(p - S.xyz);
    vec3 r = reflect(rd, n);
    vec3 L = u_light - p;
    float dist = length(L);
    float vis = 1.0 / (1.0 + dist*dist*2.2);
    bool active = abs(float(hit) - u_active) < 0.5;
    if (active) vis = max(vis, 0.3 + u_bass * 0.7);
    float fr = pow(1.0 - max(0.0, dot(-rd, n)), 3.0);
    col = studio(r) * vis * (1.1 + fr);
    col += vec3(1.0) * pow(max(0.0, dot(r, L / dist)), 80.0) * vis * 6.0;
    col += vec3(0.85, 0.9, 1.0) * fr * vis * 0.25 * (1.0 + u_high * 3.0);
    col = mix(col, col * vec3(0.92, 0.95, 1.05), 0.5);
  }
  col = col / (1.0 + col) * 1.3;
  col = pow(col, vec3(0.88));
  col += grain(gl_FragCoord.xy, u_time) * 0.03;
  gl_FragColor = vec4(col, 1.0);
}`;

const P = VOID.player;
const N = Math.min(MAX, VOID.TRACKS.length);
const stage = document.getElementById("stage");
const S = VOID.shader(stage, frag);

// Scatter the spheres with a golden-angle spiral so they never look arranged.
const homes = Array.from({ length: N }, (_, i) => {
  const a = i * 2.39996 + 0.7;
  const rad = 0.75 + (i % 3) * 0.32;
  return { x: Math.cos(a) * rad * 1.25, y: Math.sin(a) * rad * 0.8, z: -0.4 - (i % 2) * 0.9, r: 0.17 + ((i * 7) % 5) * 0.025 };
});
const spheres = homes.map((h) => ({ ...h }));
let active = -1;
let light = { x: 0, y: 0, z: 1.1 };
let pointer = null, lastMove = -1e9;
let bass = 0, high = 0;

const toWorld = (cx, cy, z) => {
  const ux = (cx - innerWidth / 2) / innerHeight, uy = (innerHeight / 2 - cy) / innerHeight;
  return { x: (ux * (4 - z)) / 1.6, y: (uy * (4 - z)) / 1.6 };
};
const pick = (cx, cy) => {
  const ux = (cx - innerWidth / 2) / innerHeight, uy = (innerHeight / 2 - cy) / innerHeight;
  let best = -1, bz = -1e9;
  spheres.forEach((s, i) => {
    const k = 1.6 / (4 - s.z);
    if (Math.hypot(ux - s.x * k, uy - s.y * k) < s.r * k * 1.15 && s.z > bz) { best = i; bz = s.z; }
  });
  return best;
};

function choose(i) {
  if (i < 0 || i === active) return;
  active = P.play(i);
}

stage.addEventListener("pointermove", (e) => {
  pointer = { x: e.clientX, y: e.clientY };
  lastMove = performance.now();
  stage.style.cursor = pick(e.clientX, e.clientY) >= 0 ? "pointer" : "none";
});
VOID.pointer(stage, { tap: (x, y) => choose(pick(x, y)) });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") choose(((active + 1) % N + N) % N);
  if (e.key === "ArrowLeft") choose(((active - 1) % N + N) % N);
});

VOID.gate(() => {});
VOID.mockNav();

const uS = new Float32Array(MAX * 4);
function frame(now) {
  const t = now / 1000;
  const L = P.levels();
  bass += (L.bass - bass) * 0.25; high += (L.high - high) * 0.2;

  // The light follows you; leave it alone and it wanders on its own.
  let target;
  if (pointer && now - lastMove < 4000) target = toWorld(pointer.x, pointer.y, 1.1);
  else target = { x: Math.sin(t * 0.23) * 1.6, y: Math.sin(t * 0.31 + 1.0) * 0.9 };
  light.x += (target.x - light.x) * 0.12;
  light.y += (target.y - light.y) * 0.12;

  spheres.forEach((s, i) => {
    const h = homes[i];
    const isActive = i === active;
    const push = active >= 0 && !isActive ? 1.25 : 1;
    const drift = VOID.reducedMotion ? 0 : 0.06;
    const tx = isActive ? 0 : h.x * push + Math.sin(t * 0.3 + i * 1.7) * drift;
    const ty = isActive ? Math.sin(t * 0.5) * 0.04 : h.y * push + Math.cos(t * 0.27 + i) * drift;
    const tz = isActive ? 0.6 : h.z;
    const tr = isActive ? 0.5 + bass * 0.04 : h.r;
    s.x += (tx - s.x) * 0.03; s.y += (ty - s.y) * 0.03; s.z += (tz - s.z) * 0.03; s.r += (tr - s.r) * 0.05;
    uS.set([s.x, s.y, s.z, s.r], i * 4);
  });

  S.u("u_s", uS, 4);
  S.u("u_n", N); S.u("u_active", active);
  S.u("u_light", light.x, light.y, light.z);
  S.u("u_bass", bass); S.u("u_high", high);
  S.draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
