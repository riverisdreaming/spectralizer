<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8203;</title>
<link rel="stylesheet" href="shared/void.css">
</head>
<body>
<canvas class="stage" id="stage"></canvas>
<div class="mark" id="mark" aria-live="polite"></div>
<script src="shared/audio.js"></script>
<script src="shared/gl.js"></script>
<script>
// PRISM: a glass keycap with one face per song. Spin it; whichever face
// comes to rest toward you is what plays. Light splits as it passes through.
const frag = `
uniform float u_ang, u_n, u_bass, u_high, u_spin;

float prism(vec3 p){
  p *= 1.7;
  p.xz *= rot(u_ang);
  float h = 0.4;
  float k = clamp((p.y + h) / (2.0*h), 0.0, 1.0);
  float R = mix(0.8, 0.6, k);                       // keycap taper
  float sector = 6.28318 / u_n;
  float a = atan(p.z, p.x) - 1.5708;
  a = mod(a + sector*0.5, sector) - sector*0.5;
  float rr = length(p.xz) * cos(a);
  vec2 w = vec2(rr - R, abs(p.y) - h);
  float d = min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - 0.07;
  d = max(d, -(length(p - vec3(0.0, h + 1.6, 0.0)) - 1.63)); // dished top
  return d * 0.8 / 1.7;
}

vec3 normal(vec3 p){
  vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy*prism(p+e.xyy) + e.yyx*prism(p+e.yyx) + e.yxy*prism(p+e.yxy) + e.xxx*prism(p+e.xxx));
}

// The studio, plus two coloured gels the glass can pick up.
vec3 env(vec3 r){
  vec3 c = studio(r) * 0.55;
  float az = atan(r.x, r.z);
  c += vec3(1.0, 0.25, 0.12) * smoothstep(0.5, 0.0, abs(az + 0.9)) * smoothstep(-0.4, 0.3, r.y) * smoothstep(0.7, 0.2, r.y) * 0.9;
  c += vec3(0.25, 0.35, 1.0) * smoothstep(0.45, 0.0, abs(az - 2.4)) * smoothstep(-0.5, 0.2, r.y) * 0.8;
  c += vec3(1.0, 0.2, 0.7) * pow(max(0.0, dot(r, normalize(vec3(0.6, -0.2, -0.7)))), 6.0) * 0.6;
  return c;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
  vec3 ro = vec3(0.0, 1.9, 4.1);
  vec3 fw = normalize(vec3(0.0, 0.05, 0.0) - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x*rt + uv.y*up + 2.3*fw);

  float t = 0.0, d = 1.0;
  for (int i = 0; i < 90; i++) {
    d = prism(ro + rd*t);
    if (d < 0.001 || t > 9.0) break;
    t += d;
  }
  vec3 col = vec3(0.0);
  if (d < 0.002) {
    vec3 p = ro + rd*t;
    vec3 n = normal(p);
    float fr = 0.04 + 0.96 * pow(1.0 - max(0.0, dot(-rd, n)), 5.0);
    vec3 refl = env(reflect(rd, n));

    // through the glass
    vec3 rd2 = refract(rd, n, 1.0 / 1.47);
    vec3 q = p - n * 0.02;
    float travel = 0.0;
    for (int i = 0; i < 48; i++) {
      float di = -prism(q);
      if (di < 0.001) break;
      q += rd2 * max(di, 0.006);
      travel += max(di, 0.006);
    }
    vec3 no = normal(q);
    vec3 trans;
    vec3 rr = refract(rd2, -no, 1.42), rg = refract(rd2, -no, 1.47), rb = refract(rd2, -no, 1.53);
    if (dot(rg, rg) < 0.01) rg = reflect(rd2, -no);
    if (dot(rr, rr) < 0.01) rr = rg;
    if (dot(rb, rb) < 0.01) rb = rg;
    trans = vec3(env(rr).r, env(rg).g, env(rb).b);
    trans = pow(trans * exp(-travel * vec3(0.18, 0.15, 0.12)), vec3(1.8)) * 2.4; // crush the mids: dark glass, bright caustics            // slight smoky glass
    trans += vec3(1.0, 0.92, 0.95) * travel * u_bass * 0.22;  // the song lights it from inside

    col = mix(trans, refl, fr) + refl * 0.08;
    col += vec3(1.0) * pow(max(0.0, dot(reflect(rd, n), normalize(vec3(-0.4, 0.9, 0.3)))), 90.0) * (1.2 + u_high * 4.0);
  } else {
    // its own faint reflection on an unseen black floor
    float glow = exp(-length((uv - vec2(0.0, -0.3)) * vec2(1.0, 3.5)) * 3.5);
    col += vec3(0.85, 0.8, 0.95) * glow * (0.025 + u_bass * 0.05);
  }
  col = col / (1.0 + col * 0.8) * 1.25;
  col = pow(col, vec3(0.9));
  col += grain(gl_FragCoord.xy, u_time) * 0.03;
  gl_FragColor = vec4(col, 1.0);
}`;

const P = VOID.player;
const N = Math.max(3, VOID.TRACKS.length);
const SECTOR = (Math.PI * 2) / N;
const NUMERALS = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const stage = document.getElementById("stage");
const markEl = document.getElementById("mark");
const S = VOID.shader(stage, frag);

let ang = 0, vel = 0, dragging = false, track = -1, entered = false, markTimer;
let bass = 0, high = 0;

function go(i) {
  i = ((i % VOID.TRACKS.length) + VOID.TRACKS.length) % VOID.TRACKS.length;
  if (i === track) return;
  track = P.play(i);
  markEl.textContent = NUMERALS[i] || i + 1;
  markEl.classList.add("on");
  clearTimeout(markTimer);
  markTimer = setTimeout(() => markEl.classList.remove("on"), 2200);
}

stage.addEventListener("pointerdown", () => (dragging = true));
VOID.pointer(stage, {
  drag(dx) { ang += dx * 0.008; vel = dx * 0.008; },
  release(vx) { dragging = false; vel = vx * 0.12; },
  tap(x) { dragging = false; vel += (x < innerWidth / 2 ? -1 : 1) * 0.05; },
});
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") vel += 0.06;
  if (e.key === "ArrowLeft") vel -= 0.06;
});
window.addEventListener("wheel", (e) => { vel += Math.sign(e.deltaY || e.deltaX) * 0.03; }, { passive: true });

VOID.gate(() => { entered = true; go(0); });
VOID.mockNav();

function frame(now) {
  const L = P.levels();
  bass += (L.bass - bass) * 0.25; high += (L.high - high) * 0.2;
  if (!dragging) {
    ang += vel;
    vel *= 0.94;
    const target = Math.round(ang / SECTOR) * SECTOR;
    if (Math.abs(vel) < 0.02) vel += (target - ang) * 0.02; // magnet toward the nearest face
    if (entered && Math.abs(vel) < 0.002 && Math.abs(target - ang) < 0.03) {
      const face = ((Math.round(ang / SECTOR) % N) + N) % N;
      if (face < VOID.TRACKS.length) go(face);
    }
  }
  const idle = VOID.reducedMotion ? 0 : Math.sin(now / 2400) * 0.015;
  S.u("u_ang", ang + idle); S.u("u_n", N);
  S.u("u_bass", bass); S.u("u_high", high);
  S.draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
